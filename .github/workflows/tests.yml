# The mod's tests, run by something other than a person remembering to.
#
# What is deliberately NOT here, and why: probe-advance.sh needs a
# controlling tty, and more than that it needs the TERMINAL whose widths are
# in question.  A runner's pty would report a runner's answers about a
# layout tuned for other terminals, which is worse than not asking: it would
# go green while the thing the check exists to catch stayed uncaught.  It
# stays manual, and tests/README.md says so beside the command.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    # The mod's tests, against the committed cases.  Node 23.6 and later
    # run .ts directly, so the tests install nothing; the type check needs
    # the two dev dependencies in the lockfile.
    runs-on: ubuntu-latest
    name: mod (node)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: node --test
        run: cd mod && node --test 'test/*.test.ts'
      - name: typecheck
        run: cd mod && npm ci && npm run typecheck
      - name: docs/options.md's option table is up to date
        run: node mod/tools/gen-option-docs.ts && git diff --exit-code docs/options.md
      # usage-dev is standard-library Python; the runner's own python3
      # runs it.
      - name: usage-dev
        run: python3 tests/usage-dev.py

  shellcheck:
    # The suites ARE the shell scripts, so a syntax error in one is a suite
    # that cannot fail. `bash -n` is the floor of that; shellcheck is the rest.
    runs-on: ubuntu-latest
    name: shell
    steps:
      - uses: actions/checkout@v4
      - name: parse
        run: for f in tests/*.sh; do bash -n "$f" || exit 1; done
      - name: shellcheck
        run: shellcheck -S warning tests/*.sh
